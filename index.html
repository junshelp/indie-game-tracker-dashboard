<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>인디게임 행사 트래커</title>
  <meta name="description" content="한국·일본·중국과 온라인 인디·서브컬처 게임 행사 일정 및 Steam 인디 게임을 확인하세요.">
  <link rel="stylesheet" href="./styles.css?v=68">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">🎮 Indie Game Event Tracker</p>
        <h1>인디·서브컬처 게임 행사 대시보드</h1>
      </div>
      <div class="actions">
        <span id="refreshTime" class="refresh-time">마지막 갱신: -</span>
      </div>
    </header>

    <!-- Stats cards -->
    <section class="stats-strip" id="statsCards" aria-label="통계 요약"></section>

    <!-- Main content area -->
    <div class="workspace">
      <!-- Left: filters (for events) -->
      <aside class="left-panel" id="eventFilters">
        <h2>국가</h2>
        <div id="countryFilters" class="filter-list"></div>
        <h2>유형</h2>
        <div id="typeFilters" class="filter-list"></div>
        <h2>상태</h2>
        <div class="status-toggles" id="statusToggles">
          <label class="chip"><input type="checkbox" data-status="upcoming" checked> 예정</label>
          <label class="chip"><input type="checkbox" data-status="past"> 종료</label>
        </div>
      </aside>

      <!-- Left: filters (for steam) -->
      <aside class="left-panel" id="steamFilters" style="display:none">
        <h2>상태</h2>
        <div class="status-toggles" id="steamStatusToggles">
          <label class="chip"><input type="checkbox" data-status="upcoming" checked> 출시 예정</label>
          <label class="chip"><input type="checkbox" data-status="released" checked> 최근 출시</label>
        </div>
        <h2>장르</h2>
        <div id="steamGenreFilters" class="filter-list"></div>
        <h2><label for="steamSortSelect">정렬</label></h2>
        <select id="steamSortSelect" style="width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:0.85rem;cursor:pointer;">
          <option value="smart">📋 스마트 정렬</option>
          <option value="date">🕐 출시일 순</option>
          <option value="recommendations">👍 추천 순</option>
          <option value="wishlist">⭐ 위시리스트 순</option>
          <option value="steam_rank">🔥 Steam 인기 순</option>
        </select>
      </aside>

      <!-- Right: views -->
      <section class="main-content">
        <div class="main-tabs" role="tablist" aria-label="대시보드 보기">
          <button class="main-tab active" data-view="timeline" id="tabTimeline" role="tab" aria-controls="viewTimeline" aria-selected="true" tabindex="0">📅 타임라인</button>
          <button class="main-tab" data-view="upcoming" id="tabUpcoming" role="tab" aria-controls="viewUpcoming" aria-selected="false" tabindex="-1">⏰ 다가오는 행사</button>
          <button class="main-tab" data-view="history" id="tabHistory" role="tab" aria-controls="viewHistory" aria-selected="false" tabindex="-1">📋 변경 이력</button>
          <button class="main-tab" data-view="steam" id="tabSteam" role="tab" aria-controls="viewSteam" aria-selected="false" tabindex="-1">🎮 Steam 인디 워치</button>
        </div>

        <div id="viewTimeline" class="view" role="tabpanel" aria-labelledby="tabTimeline" tabindex="0"></div>
        <div id="viewUpcoming" class="view" role="tabpanel" aria-labelledby="tabUpcoming" tabindex="0" style="display:none"></div>
        <div id="viewHistory" class="view" role="tabpanel" aria-labelledby="tabHistory" tabindex="0" style="display:none"></div>
        <div id="viewSteam" class="view" role="tabpanel" aria-labelledby="tabSteam" tabindex="0" style="display:none"></div>
      </section>
    </div>
  </main>

  <script src="./app.js?v=68"></script>
</body>
</html>
